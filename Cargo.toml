[workspace]
members = ["cordis-core", "cordis-runtime"]
resolver = "2"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
arc-swap = "1.7"
async-trait = "0.1"
criterion = { version = "0.7", features = ["async_tokio"] }
futures = "0.3"
hdrhistogram = "=7.5.4"
parking_lot = "0.12"
slotmap = "1.0"
smallvec = "1.15"
stats_alloc = "0.1.10"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
